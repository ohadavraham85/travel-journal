<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1226">
<title>יומן מסעות</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: night-flight journal — full-bleed photo heroes, glowing route over a dark map, colour-coded days as postcards. One deliberate dark look. */
:root{
  color-scheme:dark;
  --night:#0B1226; --night2:#111B36; --card:#16213F; --card2:#1E2B52; --line:#2A3A66;
  --ink:#F6F1E7; --muted:#A9B3CF; --dim:#7D88A8;
  --gold:#FFC74A; --rose:#FF5A6E; --teal:#3FD6CB; --violet:#9B87FF; --green:#62D98F; --orange:#FF9F45; --sky:#56B2FF;
  --sea:#081022; --land:#18264A; --land-hi:#2A3E72; --border:#33487E;
  --on-gold:#1A1405;
  --f-hand:"Amatic SC","Frank Ruhl Libre",serif;
  --f-display:"Frank Ruhl Libre",Georgia,serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:22px;
}
*{box-sizing:border-box}
html,body{background:var(--night)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;direction:rtl;padding-block:0 110px;overflow-x:hidden}
.wrap{max-width:900px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0;line-height:1.1;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.8em;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(1200px 600px at 85% -10%,#24306a 0%,transparent 60%),radial-gradient(900px 500px at 0% 20%,#3a1d4a55 0%,transparent 60%),var(--night)}
.sky canvas{width:100%;height:100%;display:block}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--night)}

.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:800;background:var(--gold);color:var(--on-gold);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 6px 24px #ffc74a40}
.btn svg{width:18px;height:18px}
.btn.ghost{background:#ffffff12;color:var(--ink);box-shadow:none;border:1px solid #ffffff22}
.btn.danger{background:transparent;color:var(--rose);border:1.5px solid var(--rose);box-shadow:none}
.btn.small{padding:7px 14px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.glass{background:#0b122699;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #ffffff22}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-weight:700;font-size:.85rem;background:#ffffff14;border:1px solid #ffffff26;color:var(--ink);white-space:nowrap}
.chip.gold{background:var(--gold);color:var(--on-gold);border-color:transparent}
.chip.ok{color:var(--green);border-color:#62d98f66}
.chip.lock{color:var(--muted)}
.chip svg{width:14px;height:14px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-hand);font-weight:700;font-size:2.1rem;line-height:1}
.home-hero{padding-block:8px 6px}
.home-hero .kick{color:var(--gold);font-weight:800;letter-spacing:.08em;font-size:.85rem}
.home-hero h1{font-family:var(--f-hand);font-weight:700;font-size:clamp(3.4rem,14vw,5.6rem);line-height:.92;margin-top:4px}
.home-hero h1 em{font-style:normal;color:var(--gold)}
.feature{position:relative;display:block;width:100%;border:0;padding:0;margin-top:18px;border-radius:28px;overflow:hidden;aspect-ratio:4/5;max-height:560px;max-width:100%;background:var(--card);text-align:start;box-shadow:0 20px 60px #0008}
@media (min-width:620px){.feature{aspect-ratio:16/10}}
.feature img,.pc img,.feature .art,.pc .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feature::after,.pc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b122600 30%,#0b1226cc 72%,#0b1226 100%)}
.feature .ov{position:absolute;inset:auto 0 0 0;z-index:2;padding:22px;display:grid;gap:8px}
.feature .count{font-family:var(--f-hand);font-weight:700;font-size:clamp(3.8rem,16vw,6.4rem);line-height:.85;color:var(--gold);text-shadow:0 4px 30px #0009}
.feature .count small{font-size:.5em;color:var(--ink)}
.feature h2{font-family:var(--f-display);font-weight:900;font-size:clamp(1.7rem,6vw,2.4rem)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.feature .tl{position:absolute;top:16px;inset-inline-start:16px;z-index:2;display:flex;gap:6px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 12px}
.sec h3{font-family:var(--f-hand);font-weight:700;font-size:2.4rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pc{position:relative;border:0;padding:0;border-radius:22px;overflow:hidden;aspect-ratio:3/4;max-width:100%;background:var(--card);text-align:start;box-shadow:0 10px 30px #0006;transition:transform .2s}
.pc:hover{transform:translateY(-3px) rotate(-.4deg)}
.pc .ov{position:absolute;inset:auto 0 0 0;z-index:2;padding:14px;display:grid;gap:6px}
.pc h4{font-family:var(--f-hand);font-weight:700;font-size:2.1rem;line-height:.95}
.pc .tl{position:absolute;top:10px;inset-inline-start:10px;z-index:2}
.newcard{border:2px dashed #ffc74a77;background:#ffc74a0d;color:var(--gold);display:grid;place-items:center;align-content:center;gap:6px;font-family:var(--f-hand);font-weight:700;font-size:2rem;box-shadow:none}
.newcard::after{display:none}
.newcard svg{width:42px;height:42px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-family:var(--f-hand);font-weight:700;font-size:2.3rem;margin-bottom:4px}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-family:var(--f-hand);font-weight:700;font-size:2.2rem}

.thero{position:relative;min-height:min(62vh,520px);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:var(--card)}
.thero>img,.thero>.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b122680 0%,#0b122600 26%,#0b122600 45%,#0b1226e6 82%,var(--night) 100%)}
.thero .topbar{position:relative;z-index:3}
.thero .topbar .sp{flex:1}
.thero .tt{position:relative;z-index:2;padding-block:0 18px;display:grid;gap:8px;width:100%}
.thero h1{font-family:var(--f-hand);font-weight:700;font-size:clamp(3.6rem,15vw,6.2rem);line-height:.86;text-shadow:0 4px 30px #000a}
.thero .desc{max-width:52ch;color:#e6e9f5;font-size:1.02rem;font-weight:600}
.stats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-top:4px;padding-block:4px}
.stat{flex:1 0 auto;min-width:92px;border-radius:18px;padding:10px 14px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-hand);font-weight:700;font-size:2.7rem;line-height:.9;color:var(--c,var(--gold))}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700}
.stamps{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stamp{font-family:var(--f-hand);font-weight:700;font-size:1.6rem;line-height:1;color:var(--rose);border:2px solid var(--rose);border-radius:8px;padding:2px 10px 4px;transform:rotate(-3deg);background:#ff5a6e14}
.stamp:nth-child(2n){transform:rotate(2deg);color:var(--teal);border-color:var(--teal);background:#3fd6cb14}

.mapbox{position:relative;height:min(58vh,520px);margin-top:18px;border-radius:26px;overflow:hidden;background:var(--sea);box-shadow:0 20px 60px #0009,inset 0 0 0 1px var(--line)}
@media (max-width:620px){.mapbox{border-radius:0;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}}
.map{position:absolute;inset:0;touch-action:none}
.map svg{width:100%;height:100%;display:block;background:radial-gradient(circle at 70% 30%,#0f1a38,var(--sea));direction:ltr}
.land path{fill:var(--land);stroke:var(--border);stroke-width:.7;vector-effect:non-scaling-stroke}
.land path.hi{fill:var(--land-hi)}
.cdot{fill:var(--dim)}
.clabel{fill:var(--muted);font:600 11px var(--f-body);paint-order:stroke;stroke:var(--land);stroke-width:3px;pointer-events:none;text-anchor:end}
.rt{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #ffc74acc)}
.pl{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:1 9;opacity:.95}
@media (prefers-reduced-motion:no-preference){.pl{animation:flow 1.2s linear infinite}.rt.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s ease-out forwards}.pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.mk{cursor:pointer}
.mk .dot{stroke:#fff;stroke-width:2.5}
.mk text{fill:#0b1226;font:800 11px var(--f-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mlabel{fill:#fff;font:700 12px var(--f-body);paint-order:stroke;stroke:var(--sea);stroke-width:4px;pointer-events:none;text-anchor:end}
.maptools{position:absolute;top:12px;inset-inline-end:12px;display:grid;gap:8px;z-index:3}
.daypills{position:absolute;top:12px;inset-inline-start:12px;inset-inline-end:64px;z-index:3;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.daypills button{border-radius:999px;padding:5px 12px;font-weight:800;font-size:.82rem;white-space:nowrap;background:#0b1226b3;color:var(--ink);border:1.5px solid var(--c,#ffffff55)}
.daypills button[aria-pressed="true"]{background:var(--c,var(--gold));color:#0b1226}
.mpop{position:absolute;z-index:4;inset:auto 12px 12px 12px;max-width:420px;margin-inline:auto;border-radius:20px;overflow:hidden;background:var(--card2);box-shadow:0 14px 40px #000b;display:grid;grid-template-columns:1fr 110px;min-height:110px}
.mpop.noimg{grid-template-columns:1fr}
.mpop img{width:110px;height:100%;object-fit:cover;grid-column:2;grid-row:1}
.mpop .b{padding:12px 14px;display:grid;gap:4px;align-content:start;min-width:0;grid-column:1;grid-row:1}
.mpop h4{font-family:var(--f-display);font-size:1.08rem;padding-inline-end:28px}
.mpop .x{position:absolute;top:6px;inset-inline-end:8px;border:0;background:#0008;color:#fff;border-radius:50%;width:28px;height:28px}
.mpop.noimg .x{inset-inline-end:8px}

.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;display:flex;gap:4px;margin-top:22px;padding:5px;border-radius:999px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1;border:0;background:none;padding:9px 14px;border-radius:999px;font-weight:800;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center;justify-content:center}
.tab[aria-selected="true"]{background:var(--gold);color:var(--on-gold)}
.tab .n{font-size:.75rem;opacity:.7}
.panel{padding-top:16px}

.day{margin-top:20px;border-radius:26px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.dhead{padding:18px 18px 16px;background:linear-gradient(135deg,var(--c) 0%,color-mix(in srgb,var(--c) 60%,#0b1226) 100%);color:#0b1226;display:grid;gap:4px}
.dhead .dn{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dhead .dn b{font-family:var(--f-hand);font-weight:700;font-size:3.3rem;line-height:.8}
.dhead .dn span{font-weight:800;font-size:.95rem;opacity:.85}
.dhead h3{font-family:var(--f-display);font-weight:900;font-size:1.35rem}
.dhead p{margin:4px 0 0;font-size:.95rem;font-weight:600;opacity:.9;max-width:62ch}
.dbody{padding:14px;display:grid;gap:12px}
.schedbtn{justify-self:start;border:0;background:#ffffff10;border-radius:999px;padding:8px 14px;font-weight:800;color:var(--c);display:flex;gap:6px;align-items:center}
.schedbtn svg{width:16px;height:16px;transition:transform .2s}
.schedbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.sched{list-style:none;margin:0;padding:0 16px 0 0;display:grid;border-inline-start:2px solid var(--c);margin-inline-start:6px}
.sched li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding-block:6px;position:relative}
.sched li::before{content:"";position:absolute;inset-inline-start:-24px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--night);border:3px solid var(--c)}
.sched .h{font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
.place{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px;background:var(--night2);border-radius:18px;padding:10px;align-items:start}
.place.noimg{grid-template-columns:1fr}
.place .ph{width:104px;aspect-ratio:1;border-radius:14px;overflow:hidden;border:0;padding:0;background:var(--card2);grid-column:2;grid-row:1}
.place .ph img{width:100%;height:100%;object-fit:cover;display:block}
.place .inf{display:grid;gap:4px;min-width:0;padding:4px 4px 2px;grid-column:1;grid-row:1}
.place.big{grid-template-columns:1fr}
.place.big .ph{grid-column:1;grid-row:1;width:100%;aspect-ratio:16/9}
.place.big .inf{grid-row:2}
.place .inf h4{font-family:var(--f-display);font-size:1.12rem;font-weight:700}
.place.done{opacity:.6}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.75rem;font-weight:800;padding:2px 9px;border-radius:999px;background:#ffffff10;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.tag.t{color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.tag.warn{color:var(--orange);background:#ff9f4520}
.tag svg{width:12px;height:12px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 0;color:#d9deef;font-size:.94rem}
.clamp.open{display:block}
.more{border:0;background:none;color:var(--c);font-weight:800;padding:0;justify-self:start;font-size:.88rem}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lnk{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:.85rem;text-decoration:none;color:var(--ink);background:#ffffff12;border-radius:999px;padding:7px 12px;border:0}
.lnk svg{width:14px;height:14px}
.lnk.go{background:var(--c,var(--gold));color:#0b1226}

.jday{margin-top:24px}
.jhead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.jhead b{font-family:var(--f-hand);font-weight:700;font-size:2.9rem;line-height:.8;color:var(--c)}
.jhead span{color:var(--muted);font-weight:700}
.stop{border-radius:24px;overflow:hidden;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.stop .mosaic{display:grid;gap:3px;grid-template-columns:2fr 1fr;grid-auto-rows:120px}
.stop .mosaic button{border:0;padding:0;background:var(--card2);overflow:hidden}
.stop .mosaic button:first-child{grid-row:span 2}
.stop .mosaic.one{grid-template-columns:1fr;grid-auto-rows:auto}
.stop .mosaic.one button{aspect-ratio:4/3;grid-row:auto}
.stop .mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.stop .b{padding:14px 16px;display:grid;gap:6px}
.stop h4{font-family:var(--f-display);font-weight:900;font-size:1.3rem}
.leg{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem;font-weight:700;margin:-4px 0 10px;padding-inline-start:18px}
.leg i{flex:0 0 40px;border-top:2px dashed var(--gold)}

.dgrp{margin-top:22px}
.dgrp>h3{font-family:var(--f-hand);font-weight:700;font-size:2.2rem;margin-bottom:8px;color:var(--c)}
.pass{position:relative;display:grid;grid-template-columns:1fr auto;border-radius:20px;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);overflow:hidden;margin-bottom:10px}
.pass .main{padding:14px 16px;display:grid;gap:6px;min-width:0}
.pass .stub{padding:14px 12px;border-inline-start:2px dashed var(--line);display:grid;place-items:center;align-content:center;gap:2px;width:92px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.pass .stub b{font-family:var(--f-hand);font-weight:700;font-size:2.3rem;line-height:.9}
.pass .stub b svg{width:30px;height:30px}
.pass .stub span{font-size:.72rem;color:var(--muted);font-weight:800}
.pass::before,.pass::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--night);left:83px}
.pass::before{top:-9px}.pass::after{bottom:-9px}
.pass h4{font-family:var(--f-display);font-weight:900;font-size:1.15rem}
.ref{display:inline-flex;align-items:center;gap:8px;background:#ffffff10;border-radius:10px;padding:3px 4px 3px 10px;width:max-content;max-width:100%}
.ref b{font-family:var(--f-mono);letter-spacing:.06em;direction:ltr}
.ref button{border:0;background:var(--gold);color:var(--on-gold);font-size:.75rem;font-weight:800;border-radius:7px;padding:3px 8px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.file{display:flex;align-items:center;gap:8px;border-radius:12px;padding:4px 12px 4px 4px;font-size:.85rem;font-weight:700;color:var(--ink);text-decoration:none;background:#ffffff10;max-width:100%}
.file img{width:40px;height:40px;object-fit:cover;border-radius:9px}
.file .pdf{width:40px;height:40px;border-radius:9px;background:var(--rose);color:#fff;display:grid;place-items:center;font:800 .7rem var(--f-body);flex:none}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.drive{background:linear-gradient(135deg,#1c2f5a,var(--card));border:1px solid #56b2ff44;border-radius:22px;padding:14px 16px;margin-bottom:6px;display:grid;gap:4px}
.drive .dh{display:flex;align-items:center;gap:12px}
.drive b{font-size:1.05rem}
.lnk svg[viewBox="0 0 87 78"],.file svg[viewBox="0 0 87 78"],.filebtn svg[viewBox="0 0 87 78"]{width:20px;height:18px}
.dpick{display:grid;gap:8px;background:var(--night2);border-radius:16px;padding:10px}
.dlist{display:grid;gap:6px;max-height:260px;overflow:auto}
.drow{display:flex;align-items:center;gap:10px;border:0;background:#ffffff0d;border-radius:12px;padding:6px 10px 6px 6px;text-align:start;color:var(--ink)}
.drow .pdf{width:38px;height:38px;border-radius:9px;background:var(--rose);color:#fff;display:grid;place-items:center;font:800 .68rem var(--f-body);flex:none}
.drow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.cgrp{margin-top:20px;background:var(--card);border-radius:24px;padding:16px;border:1px solid var(--line)}
.cgh{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.cgh h3{font-family:var(--f-hand);font-weight:700;font-size:2.2rem;flex:1}
.ring{width:56px;height:56px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring text{fill:var(--ink);font:800 13px var(--f-body);text-anchor:middle;dominant-baseline:central}
.check{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line)}
.check input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--c);flex:none;display:grid;place-items:center;margin:0;background:transparent}
.check input:checked{background:var(--c)}

(function stars(){
  const c=$("#stars"), x=c.getContext("2d"); let W,H,S=[];
  const size=()=>{ const d=Math.min(2,devicePixelRatio||1); W=c.width=innerWidth*d; H=c.height=innerHeight*d; S=Array.from({length:Math.round(innerWidth*innerHeight/5200)},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.3+.3)*d,p:Math.random()*6.28,s:.4+Math.random()*1.2})); };
  size(); addEventListener("resize",size);
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const draw=t=>{ x.clearRect(0,0,W,H); for(const s of S){ x.globalAlpha=still?.6:.35+.45*Math.sin(s.p+t/1000*s.s); x.fillStyle="#fff"; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill(); } if(!still) requestAnimationFrame(draw); };
  requestAnimationFrame(draw);

/* ---------- Geo data (country shapes, city names) — served next to the app and cached for offline ---------- */
let COUNTRIES=[], NUM2A2={}, PLACES=[];
const norm = x => x.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[łŁ]/g,"l").toLowerCase();
async function loadGeo(){
  const get = async f => { const r=await fetch("geo/"+f); if(!r.ok) throw new Error(f); return r.json(); };
  try{
    const [topo,n2a,places]=await Promise.all([get("countries-50m.json"),get("num2a2.json"),get("places.json")]);
    COUNTRIES=topojson.feature(topo, topo.objects.countries).features; NUM2A2=n2a; PLACES=places; PLACES.forEach(p=>p.push(norm(p[0])));
  }catch(e){ console.warn("geo data unavailable", e); }
}
function searchPlaces(q){ q=norm(q.trim()); if(q.length<2) return []; const a=[],b=[]; for(const p of PLACES){ if(p[5].startsWith(q)) a.push(p); else if(p[5].includes(q)) b.push(p); if(a.length>=8) break; } return a.concat(b).slice(0,8); }
let heNames; try { heNames = new Intl.DisplayNames(["he"],{type:"region"}); } catch(e){ heNames=null; }
function countryName(f){ const a2=NUM2A2[+f.id]; try{ if(a2&&heNames){ const n=heNames.of(a2); if(n&&n!==a2) return n; } }catch(e){} return f.properties.name; }
const countryCache = new Map();
function countryAt(lng,lat){ const k=lng.toFixed(3)+","+lat.toFixed(3); if(countryCache.has(k)) return countryCache.get(k); let r=null; for(const f of COUNTRIES){ if(d3.geoContains(f,[lng,lat])){ r=f; break; } } countryCache.set(k,r); return r; }

let clipN=0;
class TripMap {
  constructor(host, opts={}){
    this.host=host; this.opts=opts; host.classList.add("map");
    this.svg=d3.select(host).append("svg").attr("role","img").attr("aria-label","מפת המסלול");
    this.defs=this.svg.append("defs");
    this.gLand=this.svg.append("g").attr("class","land");
    this.gOver=this.svg.append("g");
    this.t=d3.zoomIdentity; this.stops=[]; this.plans=[]; this.hi=new Set(); this.trip=null;
    this.zoom=d3.zoom().scaleExtent([1,6000]).on("zoom",e=>{ this.t=e.transform; this.apply(); }).on("end",()=>this.opts.onMove&&this.opts.onMove(this.center()));
    this.svg.call(this.zoom).on("dblclick.zoom",null).on("click",()=>this.opts.onBlank&&this.opts.onBlank());
    this.ro=new ResizeObserver(()=>this.resize()); this.ro.observe(host);
    this.resize();
  }
  resize(){
    const w=this.host.clientWidth, h=this.host.clientHeight; if(!w||!h) return; if(w===this.w&&h===this.h) return;
    const keep=this.w?this.center():null, keepK=this.t.k;
    this.w=w; this.h=h;
    this.proj=d3.geoMercator().scale(w/(2*Math.PI)).translate([w/2,h/2]).precision(0);
    this.path=d3.geoPath(this.proj);
    this.gLand.selectAll("path").data(COUNTRIES).join("path").attr("d",this.path);
    this.zoom.extent([[0,0],[w,h]]).translateExtent([[-w*.5,h/2-w*.62],[w*1.5,h/2+w*.62]]);
    this.paintHi();
    if(this.pending){ const p=this.pending; this.pending=null; this.fit(p.pts,p.opt); }
    else if(keep) this.centerOn(keep,keepK,false); else this.apply();
  }
  paintHi(){ this.gLand.selectAll("path").classed("hi",d=>this.hi.has(d.id)); }
  setData(stops, plans, trip){
    this.stops=stops; this.plans=plans; this.trip=trip;
    this.hi=new Set(); for(const s of [...stops,...plans]){ const c=countryAt(s.lng,s.lat); if(c) this.hi.add(c.id); }
    this.paintHi(); this.apply();
  }
  screen(lng,lat){ return this.t.apply(this.proj([lng,lat])); }
  line(pts){
    let d="";
    for(let i=0;i<pts.length;i++){
      if(i===0){ const s=this.screen(pts[0][0],pts[0][1]); d+=`M${s[0].toFixed(1)},${s[1].toFixed(1)}`; continue; }
      const a=pts[i-1], b=pts[i], n=Math.min(48,Math.max(1,Math.ceil(hav(a,b)/80))), ip=d3.geoInterpolate(a,b);
      for(let j=1;j<=n;j++){ const q=ip(j/n), s=this.screen(q[0],q[1]); d+=`L${s[0].toFixed(1)},${s[1].toFixed(1)}`; }
    }
    return d;
  }
  apply(){
    if(!this.proj) return;
    this.gLand.attr("transform",this.t);
    const g=this.gOver; g.selectAll("*").remove(); this.defs.selectAll("*").remove();
    const k=this.t.k, maxRank=Math.min(10,Math.floor(Math.log2(k))-1);
    if(maxRank>=0){ const used=new Set(); let n=0;
      for(const p of PLACES){ if(p[4]>maxRank) continue; const [x,y]=this.screen(p[3],p[2]); if(x<-20||y<-10||x>this.w+20||y>this.h+10) continue;
        const key=Math.floor(x/110)+":"+Math.floor(y/26); if(used.has(key)) continue; used.add(key);
        g.append("circle").attr("class","cdot").attr("cx",x).attr("cy",y).attr("r",2.2); g.append("text").attr("class","clabel").attr("x",x-5).attr("y",y+4).text(p[0]); if(++n>60) break; } }
    for(let i=1;i<this.plans.length;i++){ const a=this.plans[i-1], b=this.plans[i];
      g.append("path").attr("class","pl").attr("stroke",dayColor(this.trip,b.date)).attr("d",this.line([[a.lng,a.lat],[b.lng,b.lat]])); }
    const sp=this.stops.map(p=>[p.lng,p.lat]);
    if(sp.length>1){ const p=g.append("path").attr("class","rt").attr("d",this.line(sp)); if(this.animateNext){ const L=p.node().getTotalLength(); p.classed("draw",true).style("--len",L); this.animateNext=false; } }
    const showLabels=k>=150;
    this.plans.forEach(p=>{ const [x,y]=this.screen(p.lng,p.lat); if(x<-30||y<-30||x>this.w+30||y>this.h+30) return; const c=dayColor(this.trip,p.date);
      const m=g.append("g").attr("class","mk").attr("transform",`translate(${x},${y})`);
      m.append("circle").attr("class","dot").attr("r",7.5).attr("fill",c);
      m.on("click",e=>{ e.stopPropagation(); this.opts.onMarker&&this.opts.onMarker(p); }); });
    this.stops.forEach((p,i)=>{ const [x,y]=this.screen(p.lng,p.lat); if(x<-40||y<-40||x>this.w+40||y>this.h+40) return;
      const m=g.append("g").attr("class","mk").attr("transform",`translate(${x},${y})`);
      if(i===this.stops.length-1) m.append("circle").attr("class","pulse").attr("r",16).attr("fill","#FFC74A");
      const ph=p.photos?.find(a=>assetSrc(a));
      if(ph){ const id="cl"+(++clipN); this.defs.append("clipPath").attr("id",id).append("circle").attr("r",17);
        m.append("circle").attr("r",20).attr("fill","#FFC74A");
        m.append("image").attr("href",assetSrc(ph)).attr("x",-17).attr("y",-17).attr("width",34).attr("height",34).attr("preserveAspectRatio","xMidYMid slice").attr("clip-path",`url(#${id})`);
      } else { m.append("circle").attr("class","dot").attr("r",12).attr("fill","#FFC74A"); m.append("text").text(i+1); }
      if(showLabels) g.append("text").attr("class","mlabel").attr("x",x-24).attr("y",y+4).text(p.title||"");
      m.on("click",e=>{ e.stopPropagation(); this.opts.onMarker&&this.opts.onMarker(p); }); });
  }
  center(){ if(!this.proj) return null; const ll=this.proj.invert(this.t.invert([this.w/2,this.h/2])); return {lng:ll[0],lat:ll[1]}; }
  centerOn(c,k,animate=true){
    if(!this.proj){ this.pending={pts:[[c.lng,c.lat]],opt:{k}}; return; }
    const p=this.proj([c.lng,c.lat]); const t=d3.zoomIdentity.translate(this.w/2-k*p[0], this.h/2-k*p[1]).scale(k);
    (animate?this.svg.transition().duration(600):this.svg).call(this.zoom.transform,t);
  }
  fit(pts,opt={}){
    if(!this.proj){ this.pending={pts,opt}; return; }
    if(!pts.length) pts=[[-150,62],[170,-45]];
    if(pts.length===1||opt.k) return this.centerOn({lng:pts[0][0],lat:pts[0][1]}, opt.k||900, opt.animate!==false);
    const xy=pts.map(p=>this.proj(p)); const [x0,x1]=d3.extent(xy,p=>p[0]), [y0,y1]=d3.extent(xy,p=>p[1]);
    const padTop=opt.padTop||60, pad=opt.pad||44;
    let k=Math.min(Math.max(this.w-pad*2,40)/Math.max(x1-x0,1e-4), Math.max(this.h-padTop-pad,40)/Math.max(y1-y0,1e-4)); k=Math.min(Math.max(k,1),2500);
    const t=d3.zoomIdentity.translate(this.w/2-k*(x0+x1)/2, (this.h+padTop-pad)/2-k*(y0+y1)/2).scale(k);
    (opt.animate===false?this.svg:this.svg.transition().duration(700)).call(this.zoom.transform,t);
  }
  destroy(){ this.ro.disconnect(); this.svg.remove(); }
}

/* ---------- Local store: IndexedDB. Every trip, item and file lives on the device first. ----------
   trips  {id, ...Trip}            items {tripId, id, ...Item}   (deleted:true = tombstone)
   blobs  {id, blob, type}         meta  {k, v}                                                  */
const IDB = {
  db:null,
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open("travel-journal",1);
    r.onupgradeneeded=()=>{ const d=r.result;
      d.createObjectStore("trips",{keyPath:"id"});
      d.createObjectStore("items",{keyPath:["tripId","id"]}).createIndex("trip","tripId");
      d.createObjectStore("blobs",{keyPath:"id"});
      d.createObjectStore("meta",{keyPath:"k"}); };
    r.onsuccess=()=>{ this.db=r.result; res(); }; r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error("blocked")); }); },
  // Runs fn(store) inside one transaction; resolves with the result of the request fn returns (if any) once committed.
  run(store,mode,fn){ return new Promise((res,rej)=>{ const t=this.db.transaction(store,mode); const r=fn(t.objectStore(store)); t.oncomplete=()=>res(r instanceof IDBRequest?r.result:undefined); t.onerror=t.onabort=()=>rej(t.error); }); },
};
const Store = {
  trips: () => IDB.run("trips","readonly",s=>s.getAll()),
  putTrip: t => IDB.run("trips","readwrite",s=>{ s.put(t); }),
  items: tripId => IDB.run("items","readonly",s=>s.index("trip").getAll(tripId)),
  putItems: (tripId,list) => IDB.run("items","readwrite",s=>{ for(const it of list) s.put({...it,tripId}); }),
  getBlob: id => IDB.run("blobs","readonly",s=>s.get(id)),
  putBlob: (id,blob,type) => IDB.run("blobs","readwrite",s=>{ s.put({id,blob,type}); }),
  delBlobs: ids => IDB.run("blobs","readwrite",s=>{ for(const id of ids) s.delete(id); }),
};
const refsOf = it => [...(it.files||[]),...(it.photos||[]),...(it.photo?[it.photo]:[]),...(it.cover?[it.cover]:[])].filter(a=>a&&a.id);
async function ensureUrls(refs){
  for(const a of refs){ if(urlCache.has(a.id)) continue; try{ const b=await Store.getBlob(a.id); if(b) urlCache.set(a.id,URL.createObjectURL(b.blob)); }catch(e){} }
}
async function storeFile(file,maxPx){
  const isImg=file.type.startsWith("image/"); const blob=isImg&&maxPx?await compressImage(file,maxPx):file;
  const type=isImg?(blob.type||file.type):(file.type||"application/pdf");
  const id=uid(); await Store.putBlob(id,blob,type); urlCache.set(id,URL.createObjectURL(blob));
  return {id,type,name:file.name};
}

const byWhen = (a,b) => (a.date||"9999").localeCompare(b.date||"9999") || (a.time||"").localeCompare(b.time||"") || (a.createdAt||0)-(b.createdAt||0);
const stopsOf = items => items.filter(i=>i.kind==="stop").sort(byWhen);
const plansOf = items => items.filter(i=>i.kind==="plan").sort(byWhen);
function statsOf(trip, items){
  const stops=stopsOf(items).filter(s=>s.lat!=null);
  let km=0; for(let i=1;i<stops.length;i++) km+=hav([stops[i-1].lng,stops[i-1].lat],[stops[i].lng,stops[i].lat]);
  let pkm=0; const pl=plansOf(items).filter(p=>p.lat!=null); for(let i=1;i<pl.length;i++) pkm+=hav([pl[i-1].lng,pl[i-1].lat],[pl[i].lng,pl[i].lat]);
  const cs=new Map(); (stops.length?stops:pl).forEach(s=>{ const c=countryAt(s.lng,s.lat); if(c) cs.set(c.id,countryName(c)); });
  const photos=items.filter(i=>i.kind==="stop").reduce((n,s)=>n+(s.photos?.length||0),0);
  const days = trip.start&&trip.end ? dayDiff(trip.start,trip.end)+1 : 0;
  return {km, pkm, countries:[...cs.values()], photos, days, stops:stopsOf(items).length, places:plansOf(items).length};
}

function coverArt(t){
  let s=0; for(const c of (t.id||"x")) s=(s*31+c.charCodeAt(0))>>>0; const r=()=>((s=(s*1103515245+12345)>>>0)/4294967296);

/* ---------- Writes: everything goes to IndexedDB first ---------- */
function stripLocal(o){ const c={...o}; delete c._n; return c; }
async function save(id, data, merge=false){
  const t=currentTrip(); if(!t) return null;
  try{
    const prev=id?S.items.find(i=>i.id===id):null, now=Date.now();
    const body={...(prev?stripLocal(prev):{}), ...data, id:id||uid(), updatedAt:now}; if(!prev) body.createdAt=now;
    await Store.putItems(t.id,[body]); await touchTrip(t); await loadItems(); return body.id;
  }catch(e){ writeError(e); return null; }
}
async function removeItem(id){
  const t=currentTrip(), prev=S.items.find(i=>i.id===id); if(!t||!prev) return;
  // Tombstone, not a hard delete, so a device that syncs later can't bring the item back.
  try{ await Store.putItems(t.id,[{id,kind:prev.kind,createdAt:prev.createdAt,updatedAt:Date.now(),deleted:true}]); await touchTrip(t); await loadItems(); }catch(e){ writeError(e); }
}
async function touchTrip(t){ t.updatedAt=Date.now(); await Store.putTrip(t); }
async function saveTrip(t){ t.updatedAt=Date.now(); await Store.putTrip(t); S.trips.set(t.id,t); }
async function deleteTrip(trip){
  const items=await Store.items(trip.id);
  await Store.delBlobs([...items.flatMap(refsOf),...refsOf(trip)].map(a=>a.id));
  await Store.putTrip({id:trip.id,deleted:true,createdAt:trip.createdAt,updatedAt:Date.now()});
  S.trips.delete(trip.id);
}
function writeError(e){ console.error(e); if(e?.name==="QuotaExceededError") toast("נגמר המקום בטלפון. מחק תמונות או טיולים ישנים ונסה שוב."); else toast("השמירה נכשלה. נסה שוב."); }
async function compressImage(file,max=2000){
  try{ const bmp=await createImageBitmap(file,{imageOrientation:"from-image"}); const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.86)); if(blob) return blob; }catch(e){}
  return file;
}
async function readExif(file){
  // One full parse: the lite build throws when given a tag list to pick.
  try{ if(!window.exifr) return {}; const m=await exifr.parse(file).catch(()=>null);
    const out={}; if(m&&isFinite(m.latitude)&&isFinite(m.longitude)){ out.lat=m.latitude; out.lng=m.longitude; }
    const dt=m?.DateTimeOriginal; if(dt instanceof Date&&!isNaN(dt)){ out.date=ymd(dt); out.time=`${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`; }
    return out; }catch(e){ return {}; }
}

/* ---------- Import / export: {app:"travel-journal", version:1, trip, items}; files referenced as {file:"photos/x.jpg"} ---------- */
let jszipP=null;
function loadJSZip(){ return jszipP ||= new Promise((res,rej)=>{ if(window.JSZip) return res(window.JSZip); const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; s.onload=()=>res(window.JSZip); s.onerror=()=>{ jszipP=null; rej(new Error("jszip")); }; document.head.append(s); }); }
const MIME={jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",heic:"image/heic",pdf:"application/pdf"};
const extOf = n => (n.match(/\.([a-z0-9]+)$/i)?.[1]||"").toLowerCase();
const baseName = n => String(n).split(/[\\/]/).pop().toLowerCase();
const isZip = f => /\.zip$/i.test(f.name) || /zip/.test(f.type);
async function readBundle(files){
  let snap=null; const media=new Map();
  const take=async(name,blob)=>{ if(extOf(name)==="json"){ let j; try{ j=JSON.parse(await blob.text()); }catch(e){ return; } if(j?.app==="travel-journal"&&j.trip) snap=j; } else media.set(baseName(name), new File([blob],baseName(name),{type:blob.type||MIME[extOf(name)]||""})); };
  for(const f of files){
    if(isZip(f)){ const JSZip=await loadJSZip(); const z=await JSZip.loadAsync(f); for(const e of Object.values(z.files)) if(!e.dir&&!/(^|\/)(__MACOSX|\.)/.test(e.name)) await take(e.name, await e.async("blob")); }
    else await take(f.name,f);
  }
  return {snap,media};
}
async function importTrip({snap,media},onStep=()=>{}){
  const missing=[], tripId=uid(), now=Date.now();
  const fix=async ref=>{
    if(!ref) return null;
    const key=ref.file?baseName(ref.file):null; const f=key&&media.get(key);
    if(!f){ missing.push(ref.file||ref.name||"קובץ"); return null; }
    const isImg=(f.type||ref.type||"").startsWith("image/");
    const stored=await storeFile(f.type?f:new File([f],f.name,{type:ref.type||""}), isImg?2400:0);
    const out={...ref,...stored,name:ref.name||f.name}; delete out.file; return out;
  };
  const items=[];
  for(const it of snap.items||[]){
    const x={...it}; delete x._n; delete x.tripId; onStep(`מייבא: ${x.title||x.text||""}`);
    if(x.files) x.files=(await Promise.all(x.files.map(fix))).filter(Boolean);
    if(x.photos) x.photos=(await Promise.all(x.photos.map(fix))).filter(Boolean);
    if(x.photo) x.photo=await fix(x.photo);
    x.id=x.id||uid(); x.createdAt=x.createdAt||now; x.updatedAt=now;
    items.push(x);
  }
  const trip={...snap.trip}; delete trip.space; delete trip.drive;
  trip.cover=await fix(trip.cover);
  Object.assign(trip,{id:tripId,shared:false,createdAt:trip.createdAt||now,updatedAt:now});
  await Store.putItems(tripId,items); await saveTrip(trip);
  return {id:tripId,missing,count:items.filter(i=>!i.deleted).length};
}

async function exportTrip(t){
  const JSZip=await loadJSZip(); const z=new JSZip(); const items=(await Store.items(t.id)).filter(i=>!i.deleted);
  const out=async ref=>{ if(!ref?.id) return ref; const b=await Store.getBlob(ref.id); if(!b) return null; const ext=Object.keys(MIME).find(k=>MIME[k]===b.type)||extOf(ref.name||"")||"bin"; const path=`files/${ref.id}.${ext}`; z.file(path,b.blob); const r={...ref,file:path}; delete r.id; return r; };
  const xs=[];
  for(const it of items){ const x={...it}; delete x.tripId;
    if(x.files) x.files=(await Promise.all(x.files.map(out))).filter(Boolean);
    if(x.photos) x.photos=(await Promise.all(x.photos.map(out))).filter(Boolean);
    if(x.photo) x.photo=await out(x.photo);
    xs.push(x); }
  const trip={...t}; delete trip.id; trip.cover=await out(t.cover);
  z.file("trip.json", JSON.stringify({app:"travel-journal",version:1,savedAt:new Date().toISOString(),trip,items:xs},null,1));
  const blob=await z.generateAsync({type:"blob"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`travel-journal-${t.start||"trip"}-${todayStr()}.zip`; /* ASCII: some browsers drop non-Latin download names */ document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

    ${trip?`<div class="f"><span>גיבוי</span><div class="acts" style="margin:0"><button type="button" class="lnk" id="texp">${ico("up")}ייצוא טיול לקובץ</button></div><small>קובץ zip עם כל הנתונים, התמונות והמסמכים. אפשר לייבא אותו בחזרה מהמסך הראשי.</small></div>`:""}
    <div class="sheet-actions"><div style="display:flex;gap:8px"><button class="btn" id="tsave">${trip?"שמור":"צור טיול"}</button><button class="btn ghost" id="tcancel">ביטול</button></div>${trip?`<button class="btn danger small" id="tdel">מחק טיול</button>`:""}</div>`, root=>{
    const draw=()=>{ const src=coverFile?coverFile.url:assetSrc(cover); root.querySelector("#tcov").innerHTML=src?`<div class="thumb" style="width:140px"><img src="${esc(src)}" alt=""><button type="button" id="tcrm" aria-label="הסר">×</button></div>`:""; const r=root.querySelector("#tcrm"); if(r) r.onclick=()=>{ cover=null; coverFile=null; draw(); }; };
    draw(); const cf=root.querySelector("#tcf"); cf.onchange=()=>{ const f=cf.files[0]; if(f){ coverFile={file:f,url:URL.createObjectURL(f)}; draw(); } cf.value=""; };
    root.querySelector("#tcancel").onclick=closeSheet;
    const ex=root.querySelector("#texp"); if(ex) ex.onclick=async()=>{ ex.disabled=true; const l=ex.innerHTML; ex.textContent="מכין קובץ…"; try{ await exportTrip(trip); }catch(e){ toast(e?.message==="jszip"?"הייצוא צריך חיבור לאינטרנט בפעם הראשונה.":"הייצוא נכשל. נסה שוב."); } ex.disabled=false; ex.innerHTML=l; };
    const del=root.querySelector("#tdel"); if(del) confirmBtn(del,"לחץ שוב – כל תוכן הטיול יימחק",async()=>{ try{ await deleteTrip(trip); closeSheet(); go("home"); toast("הטיול נמחק"); }catch(e){ writeError(e); } });
    root.querySelector("#tsave").onclick=async e=>{
      const name=root.querySelector("#tn").value.trim(); if(!name){ toast("תן שם לטיול"); return; }
      const start=root.querySelector("#ts").value, end=root.querySelector("#te").value; if(start&&end&&end<start){ toast("תאריך החזרה לפני היציאה"); return; }
      const b=e.currentTarget; b.disabled=true; b.textContent="שומר…";
      try{ if(coverFile) cover=await storeFile(coverFile.file,1800); }catch(err){ toast("שמירת התמונה נכשלה"); }
      const data={name,start,end,desc:root.querySelector("#td").value.trim(),cover:cover?refOut(cover):null};
      try{
        if(!trip){ const id=uid(); await saveTrip({...data,id,shared:false,createdAt:Date.now()}); closeSheet(); go("trip",id); return; }
        await saveTrip({...trip,...data}); closeSheet(); renderTripHead(); renderTripBody(); toast("נשמר ✓");
      }catch(err){ writeError(err); b.disabled=false; b.textContent="שמור"; }
    };
  });
}

function lightbox(list,i){
  if(!list?.length) return; let k=Math.max(0,i);
  const el=document.createElement("div"); el.className="lightbox"; el.setAttribute("role","dialog");
  const draw=()=>{ el.innerHTML=`<img src="${esc(assetSrc(list[k]))}" alt=""><button class="lb" style="top:calc(14px + env(safe-area-inset-top,0px));left:14px" data-a="x" aria-label="סגור">×</button>${list.length>1?`<button class="lb" style="right:10px;top:50%" data-a="n" aria-label="הקודמת">›</button><button class="lb" style="left:10px;top:50%" data-a="p" aria-label="הבאה">‹</button>`:""}<div class="cap">${esc(list[k].cap||"")} ${list.length>1?`<span class="mono">${k+1}/${list.length}</span>`:""}</div>`; };
  draw(); document.body.append(el);
  const step=dx=>{ k=(k+dx+list.length)%list.length; draw(); };
  const key=e=>{ if(e.key==="Escape") close(); if(e.key==="ArrowLeft") step(1); if(e.key==="ArrowRight") step(-1); };
  const close=()=>{ el.remove(); document.removeEventListener("keydown",key); };
  el.onclick=e=>{ const a=e.target.dataset.a; if(a==="x"||e.target===el) close(); else if(a==="p") step(1); else if(a==="n") step(-1); };
  document.addEventListener("keydown",key);
  let sx=null; el.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true}); el.addEventListener("touchend",e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) step(dx>0?1:-1); sx=null; });
}

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
boot();
</script>
</body>
